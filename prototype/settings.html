<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>设置原型 · 内核与模型</title>
<style>
  /* WARM 色板（theme.rs 1:1） */
  :root {
    --paper: #FAF9F5; --sand: #F0EEE6; --sand-active: #E8E3D6; --card: #FFFFFF;
    --coral: #D97757; --coral-deep: #BF502B; --coral-deep-hover: #AF4928;
    --ink: #1F1E1D; --ink-soft: #6E6B65; --ink-faint: #B5B0A4;
    --line: #E5E1D5; --line-strong: #D3CEC1;
    --green: #7A9A65; --red: #C0504D;
    --hover: #F0EEE6; --selected: #E8E3D6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Inter, "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  .proto-banner {
    background: var(--sand); border-bottom: 1px solid var(--line);
    padding: 6px 20px; font-size: 12px; color: var(--ink-soft);
    display: flex; gap: 16px; align-items: center;
  }
  .proto-banner b { color: var(--coral-deep); font-weight: 600; }
  .layout { display: flex; min-height: calc(100vh - 33px); }
  /* 左侧分类导航（与 settings_view.rs 一致） */
  .nav { width: 180px; flex: none; padding: 16px 12px; }
  .nav-item {
    padding: 6px 12px; border-radius: 8px; color: var(--ink-soft);
    cursor: default; font-size: 14px; user-select: none;
  }
  .nav-item.clickable { cursor: pointer; }
  .nav-item.clickable:hover { background: var(--hover); }
  .nav-item.active { background: var(--selected); color: var(--ink); font-weight: 500; }
  .content { flex: 1; padding: 28px 32px 96px; }
  .page { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
  /* section：分区标题 + 一句说明（settings_kit.rs） */
  .section-head { margin-bottom: 12px; }
  .section-title { font-size: 15px; font-weight: 600; }
  .section-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  /* choice_panel：沙色面板里的单选/清单列表 */
  .panel { background: var(--sand); border-radius: 12px; padding: 4px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer; user-select: none;
  }
  .row:hover { background: var(--selected); }
  .row.static { cursor: default; }
  .row.static:hover { background: transparent; }
  .row.selected { background: var(--sand-active); }
  .row-icon { width: 18px; text-align: center; color: var(--ink-soft); flex: none; font-size: 14px; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-desc { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-desc .inuse { color: var(--coral); font-weight: 500; }
  .row-check { color: var(--coral); font-weight: 600; font-size: 13px; flex: none; width: 20px; text-align: center; }
  /* 按钮：text_button 默认档 = 卡片底细边；primary = 赤陶实底 */
  .btn {
    font: inherit; font-size: 13px; border-radius: 8px; padding: 5px 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer; flex: none; white-space: nowrap;
  }
  .btn:hover { background: var(--selected); }
  .btn.primary { background: var(--coral-deep); border-color: var(--coral-deep); color: #fff; }
  .btn.primary:hover { background: var(--coral-deep-hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  /* switch（gpui-kit Switch 的样子） */
  .switch {
    width: 34px; height: 20px; border-radius: 10px; flex: none;
    background: var(--line-strong); position: relative; cursor: pointer; transition: background .15s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: left .15s;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .switch.on { background: var(--coral); }
  .switch.on::after { left: 16px; }
  .risk-note { padding: 2px 12px 6px; font-size: 12px; color: var(--ink-soft); }
  /* 模型清单 */
  .list-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .search {
    flex: 1; min-width: 0; font: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
    background: var(--card); color: var(--ink); outline: none;
  }
  .search:focus { border-color: var(--ink-faint); }
  .model-rows { display: flex; flex-direction: column; gap: 2px; max-height: 420px; overflow-y: auto; }
  .model-row { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .model-name {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .model-name:hover { background: var(--hover); }
  .model-name.default { background: var(--selected); font-weight: 500; }
  .model-name .default-tag { color: var(--coral); font-size: 12px; font-weight: 500; flex: none; }
  .empty { padding: 8px 10px; font-size: 13px; color: var(--ink-faint); }
  /* 自定义端点折叠区 */
  details.custom { border-top: 1px solid var(--line); padding-top: 16px; }
  details.custom summary {
    cursor: pointer; font-size: 14px; font-weight: 600; list-style: none;
    display: flex; align-items: center; gap: 6px;
  }
  details.custom summary::before { content: "▸"; color: var(--ink-soft); font-size: 12px; }
  details.custom[open] summary::before { content: "▾"; }
  .form-grid { display: grid; grid-template-columns: 96px 1fr; gap: 10px 12px; align-items: center; margin-top: 14px; }
  .form-grid label { font-size: 13px; color: var(--ink-soft); text-align: right; }
  .form-grid input {
    font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; background: var(--card); color: var(--ink); outline: none;
  }
  .form-grid input:focus { border-color: var(--ink-faint); }
  /* 保存栏（内核/模型页底栏固定） */
  .save-bar[hidden] { display: none; }
  .save-bar {
    position: fixed; left: 180px; right: 0; bottom: 0;
    background: var(--paper); border-top: 1px solid var(--line);
    padding: 10px 32px; display: flex; justify-content: center; z-index: 10;
  }
  .save-bar-inner { width: 720px; display: flex; align-items: center; gap: 12px; }
  .save-hint { flex: 1; font-size: 12px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="proto-banner">
  <b>Web 原型</b><span>改这个文件存盘后刷新即生效，不碰游戏性能；满意后搬回 gpui（Rust 编译慢，只搬定稿）</span>
  <span style="margin-left:auto">数据为快照 mock，交互在前端内存里跑</span>
</div>
<div class="layout">
  <nav class="nav" id="nav"></nav>
  <main class="content"><div class="page" id="page"></div></main>
</div>
<div class="save-bar" id="savebar" hidden>
  <div class="save-bar-inner">
    <span class="save-hint" id="savehint"></span>
    <button class="btn" id="savebtn">保存</button>
  </div>
</div>

<script>
// ---------- mock 数据（对齐 2026-11-12 用户机器上的真实配置） ----------
const NAMES = ["cn:deepseek-v4.1-flash","cn:deepseek-v4.1-pro","cn:deepseek-v4.1-exp",
  "kimi-k2.8-preview","glm-5.2-air","glm-5.2-plus","minimax-m3.1","doubao-seed-2.0-lite",
  "gpt-5.2","gpt-5.2-codex","claude-opus-4.7","claude-sonnet-4.6","claude-haiku-4.5",
  "gemini-3-pro","gemini-3-flash","grok-4.7","qwen3-max","qwen3-coder-plus"];
const filler = n => Array.from({length:n},(_,i)=>`misc-model-${String(i+1).padStart(3,"0")}`);

const state = {
  tab: "kernel",            // kernel | model
  dirty: false,
  // 供应商档案（BuiltinSettings.profiles，magpie 排最前）
  profiles: [
    { name:"", baseUrl:"http://127.0.0.1:3425", model:"cn:deepseek-v4.1-flash",
      models:[...NAMES, ...filler(66)], menuHidden:[], magpie:true },
    { name:"本地网关 A", baseUrl:"http://127.0.0.1:7863/v1", model:"cn:deepseek-v4.1-flash",
      models:[...NAMES, ...filler(66)], menuHidden:[], magpie:false },
    { name:"本地网关 B", baseUrl:"http://127.0.0.1:7863/v1", model:"kimi-k2.8-preview",
      models:[...NAMES.slice(0,14), ...filler(68)], menuHidden:[], magpie:false },
    { name:"z.ai", baseUrl:"https://api.z.ai/api/coding/paas/v4", model:"glm-5.2-air",
      models:["glm-5.2-air","glm-5.2-plus","glm-5.1","glm-4.7","glm-4.6","glm-z1-air",
              "glm-z1-plus","codegeex-4","glm-4-flash","glm-4-long","chatglm-4"],
      menuHidden:[], magpie:false },
  ],
  active: 0,                // 内核页供应商单选 → Settings.builtin.active
  view: 0,                  // 模型页正在查看的来源
  search: "",
  // magpie 网关状态（内核页第一行）
  magpie: { running: "0.1.3795" },
  // 本机 agent（agents.rs PRESETS 的子集，检测状态 mock）
  agents: [
    { id:"claude", name:"Claude Code", state:"ready", enabled:true,  desc:"已接入 · 经 ACP 协议" },
    { id:"opencode", name:"OpenCode", state:"ready", enabled:false, desc:"已检测 · 0.6.x" },
    { id:"gemini", name:"Gemini CLI", state:"upgrade", enabled:false, fix:"如何升级", desc:"检测到旧版本，ACP 需要更新" },
    { id:"pi", name:"pi", state:"missing", enabled:false, fix:"如何安装", desc:"未检测到" },
  ],
};

const NAV = ["通用","项目","内核","模型","权限","MCP","插件","用量","记忆"];
const TABS = { "内核":"kernel", "模型":"model" };

// ---------- 渲染 ----------
const $page = document.getElementById("page");
const $nav = document.getElementById("nav");
const $savebar = document.getElementById("savebar");
const $savehint = document.getElementById("savehint");

function hostOf(url) { try { return new URL(url).host } catch { return url } }
function profileTitle(p) { return p.magpie ? "magpie 网关" : (p.name.trim() || p.baseUrl) }
function markDirty(msg) { state.dirty = true; $savehint.textContent = msg; $savebar.hidden = false; render(); }
function save() { state.dirty = false; $savebar.hidden = true; render(); }
document.getElementById("savebtn").onclick = save;

function renderNav() {
  $nav.innerHTML = "";
  for (const label of NAV) {
    const el = document.createElement("div");
    const tab = TABS[label];
    el.className = "nav-item" + (tab && tab === state.tab ? " active" : "") + (tab ? " clickable" : "");
    el.textContent = label;
    if (tab) el.onclick = () => { state.tab = tab; state.search = ""; render(); };
    $nav.appendChild(el);
  }
}

function section(title, desc, bodyHTML) {
  return `<div><div class="section-head"><div class="section-title">${title}</div>` +
    (desc ? `<div class="section-desc">${desc}</div>` : "") + `</div>${bodyHTML}</div>`;
}

// ---- 内核页 ----
function kernelHTML() {
  // 本机内核清单（对齐 magpie 的 Agents 页）
  const mp = state.profiles.find(p => p.magpie);
  let rows = `<div class="row static"><div class="row-icon">◈</div>
    <div class="row-main"><div class="row-title">自研内核 · 经 magpie 网关</div>
    <div class="row-desc">网关运行中 · ${state.magpie.running} · ${mp ? mp.models.length : 0} 个模型</div></div></div>
    <div class="risk-note">风险：订阅账号经 magpie（第三方网关）使用可能违反各家条款；magpie 会读取各 agent 的登录信息，claudesktop 自己不碰凭据</div>`;
  for (const a of state.agents) {
    let trailing;
    if (a.state === "ready") {
      trailing = `<div class="switch ${a.enabled ? "on" : ""}" data-agent="${a.id}"></div>`;
    } else {
      trailing = `<button class="btn" data-fix="${a.id}">${a.fix}</button>`;
    }
    const dot = a.state === "ready" ? `<span style="color:var(--green)">●</span> ` : "";
    rows += `<div class="row static"><div class="row-icon">▣</div>
      <div class="row-main"><div class="row-title">${a.name}</div>
      <div class="row-desc">${dot}${a.desc}</div></div>${trailing}</div>`;
  }
  const kernelList = section("本机内核", "检测到的 agent 直接列出，开关即接入；手填档案在「模型」页底部",
    `<div class="panel">${rows}</div>`);

  // 供应商单选（只管默认，不限制模型）
  let sup = "";
  state.profiles.forEach((p, i) => {
    const host = hostOf(p.baseUrl);
    const desc = p.model ? `${host} · 默认 ${p.model}` : host;
    sup += `<div class="row ${i === state.active ? "selected" : ""}" data-sup="${i}">
      <div class="row-icon">☰</div>
      <div class="row-main"><div class="row-title">${profileTitle(p)}</div>
      <div class="row-desc">${desc}</div></div>
      ${i === state.active ? `<div class="row-check">✓</div>` : ""}</div>`;
  });
  const suppliers = section("供应商",
    "自研内核的模型经哪套端点发；只管默认，输入框里所有来源的模型都能直接挑",
    `<div class="panel">${sup}</div>`);
  return kernelList + suppliers;
}

// ---- 模型页 ----
function modelHTML() {
  // 来源清单（magpie 排最前，「在用 ·」标在 active 那行）
  let src = "";
  state.profiles.forEach((p, i) => {
    const host = hostOf(p.baseUrl);
    const desc = p.models.length ? `${host} · ${p.models.length} 个模型` : host;
    const d = i === state.active ? `<span class="inuse">在用 · </span>${desc}` : desc;
    src += `<div class="row ${i === state.view ? "selected" : ""}" data-view="${i}">
      <div class="row-icon">${p.magpie ? "◈" : "☰"}</div>
      <div class="row-main"><div class="row-title">${profileTitle(p)}</div>
      <div class="row-desc">${d}</div></div>
      ${i === state.view ? `<div class="row-check">✓</div>` : ""}</div>`;
  });
  const sources = section("模型来源",
    "所有来源的模型都能在输入框直接挑；点一行管理它的模型和端点",
    `<div class="panel">${src}</div>`);

  // 模型清单（搜索 + 开关 + 点名字设默认）
  const p = state.profiles[state.view];
  const q = state.search.trim().toLowerCase();
  const shown = p.models.filter(m => !q || m.toLowerCase().includes(q));
  let listRows;
  if (!p.models.length) {
    listRows = `<div class="empty">还没有模型列表，点「获取列表」从端点拉</div>`;
  } else if (!shown.length) {
    listRows = `<div class="empty">没有匹配的模型</div>`;
  } else {
    listRows = shown.map(m => {
      const isDef = p.model.trim() === m;
      const on = !p.menuHidden.includes(m);
      return `<div class="model-row"><div class="model-name ${isDef ? "default" : ""}" data-default="${m}">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${m}</span>
        ${isDef ? `<span class="default-tag">默认</span>` : ""}</div>
        <div class="switch ${on ? "on" : ""}" data-toggle="${m}"></div></div>`;
    }).join("");
  }
  const list = section("模型清单", "开关决定进不进输入框菜单；点名字设为默认",
    `<div class="list-head"><input class="search" placeholder="搜索模型" value="${state.search}">
     <button class="btn" data-fetch>${p.models.length ? "刷新" : "获取列表"}</button></div>
     <div class="model-rows">${listRows}</div>`);

  // 手填档案（折叠区）
  const custom = `<details class="custom"><summary>自定义端点</summary>
    <div class="form-grid">
      <label>名称</label><input value="${p.name}" placeholder="留空用端点地址">
      <label>端点地址</label><input value="${p.baseUrl}">
      <label>API Key</label><input type="password" value="sk-…">
      <label>默认模型</label><input value="${p.model}">
    </div></details>`;
  return sources + list + section("服务商", "", custom);
}

function render() {
  if (location.hash === "#model") state.tab = "model";
  if (location.hash === "#kernel") state.tab = "kernel";
  renderNav();
  $page.innerHTML = state.tab === "kernel" ? kernelHTML() : modelHTML();
  if (state.tab === "kernel") $savebar.hidden = !state.dirty;
}

// ---------- 事件（事件委托） ----------
$page.addEventListener("click", e => {
  const sw = e.target.closest("[data-agent],[data-toggle]");
  if (sw) {
    const p = state.profiles[state.view];
    if (sw.dataset.agent) {
      const a = state.agents.find(x => x.id === sw.dataset.agent);
      a.enabled = !a.enabled;
      markDirty(a.enabled ? `已接入 ${a.name}（保存后生效）` : `已断开 ${a.name}（保存后生效）`);
    } else {
      const m = sw.dataset.toggle, i = p.menuHidden.indexOf(m);
      i >= 0 ? p.menuHidden.splice(i, 1) : p.menuHidden.push(m);
      markDirty(`模型「${m}」${i >= 0 ? "已加入" : "已移出"}输入框菜单（保存后生效）`);
    }
    return;
  }
  const fix = e.target.closest("[data-fix]");
  if (fix) { alert("已复制安装命令到剪贴板（mock）"); return; }
  const sup = e.target.closest("[data-sup]");
  if (sup) { state.active = +sup.dataset.sup; markDirty("默认供应商已切换（保存后自研内核重启生效）"); return; }
  const view = e.target.closest("[data-view]");
  if (view) { state.view = +view.dataset.view; state.search = ""; render(); return; }
  const def = e.target.closest("[data-default]");
  if (def) { state.profiles[state.view].model = def.dataset.default; markDirty(`默认模型已设为 ${def.dataset.default}`); return; }
  if (e.target.closest("[data-fetch]")) { markDirty("已从端点获取 84 个模型（mock）"); return; }
});
$page.addEventListener("input", e => {
  if (e.target.classList.contains("search")) { state.search = e.target.value; render();
    const s = $page.querySelector(".search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
});
render();
</script>
</body>
</html>
