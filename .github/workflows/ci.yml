name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      gateway_asset_id:
        description: 独立网关验收包资产 ID（留空则运行常规 CI）
        type: string
        required: false
      gateway_sha256:
        description: 独立验收包 ZIP SHA256
        type: string
        required: false
      gateway_scope:
        description: 独立验收范围
        type: choice
        options: [all, kernel, desktop]
        default: all
      gateway_set:
        description: combined 为原组合，parser 只隔离统计解析
        type: choice
        options: [combined, parser]
        default: combined
      gateway_condition:
        description: 独立验收的端点条件
        type: choice
        options: [reference, calibrated]
        default: reference

# 同一分支的新提交取消上一次未跑完的任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 本仓库自己的代码不留警告（依赖 crate 的警告由 --cap-lints 豁免）
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.gateway_asset_id == '' }}
    name: fmt + clippy + test
    # GPUI 依赖 Windows / macOS 的原生层，Linux 需要额外的 X11/Wayland 依赖，先用 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy（警告即错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace

  gateway-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gateway_asset_id != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/gateway-validation.yml
    with:
      asset_id: ${{ inputs.gateway_asset_id }}
      sha256: ${{ inputs.gateway_sha256 }}
      scope: ${{ inputs.gateway_scope }}
      comparison_set: ${{ inputs.gateway_set }}
      condition: ${{ inputs.gateway_condition }}
