[package]
name = "claudesktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Claude-style desktop harness with swappable agent kernels (GPUI)"

[[bin]]
name = "claudesktop"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true }
claudesktop-core = { path = "../../crates/core" }
claudesktop-builtin = { path = "../../crates/builtin" }
futures = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"

[build-dependencies]
embed-resource = "3"
