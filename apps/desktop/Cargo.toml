[package]
name = "claudesktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Claude-style desktop harness with swappable agent kernels (GPUI)"

[[bin]]
name = "claudesktop"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true }
claudesktop-core = { path = "../../crates/core" }
claudesktop-builtin = { path = "../../crates/builtin" }
futures = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
# 远程图片的 HTTP 客户端（见 http.rs）：和内核用同一个 HTTP 栈
ureq = "3"
# 远程图片要认格式再登记（见 app/remote_image.rs、assets.rs）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

[build-dependencies]
embed-resource = "3"
