[package]
name = "claudesktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Claude-style desktop harness with swappable agent kernels (GPUI)"

[[bin]]
name = "claudesktop"
path = "src/main.rs"

[features]
headless-screenshot = ["gpui-screenshot/test-support", "gpui-platform-screenshot/test-support"]

[dependencies]
gpui-kit = { workspace = true }
gpui-screenshot = { package = "gpui-pre", version = "=0.3.9", default-features = false, optional = true }
gpui-platform-screenshot = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, optional = true }
claudesktop-core = { path = "../../crates/core" }
claudesktop-builtin = { path = "../../crates/builtin" }
futures = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
# 远程图片的 HTTP 客户端（见 http.rs）：和内核用同一个 HTTP 栈
ureq = "3"
# 远程图片要认格式再登记（见 app/remote_image.rs、assets.rs）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# 单测里直接喂 markdown 解析器（vendor 补丁的回归测试，见 chat.rs 的 autolink_ends_at_fullwidth_punctuation）
markdown = "=1.0.0"
