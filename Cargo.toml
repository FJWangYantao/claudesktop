[workspace]
resolver = "3"
members = ["apps/desktop", "crates/core", "crates/builtin"]
# 打过补丁的上游 crate（见 vendor/README.md），不算工作区成员
exclude = ["vendor"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
gpui-kit = "0.7.3"
agent-client-protocol = "3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
smol = "2"

# 中文避头尾：换行逻辑在 gpui-pre 里，拷一份改（改了什么、怎么升级见 vendor/README.md）
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
