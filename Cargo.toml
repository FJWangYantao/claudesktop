[workspace]
resolver = "3"
members = ["apps/desktop", "crates/core", "crates/builtin"]
# 打过补丁的上游 crate（见 vendor/README.md），不算工作区成员
exclude = ["vendor"]

[workspace.package]
version = "0.18.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
gpui-kit = { version = "0.7.3", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
agent-client-protocol = "3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
smol = "2"

# 打过补丁的 gpui：中文避头尾（gpui-pre）、文字纵向位置不算 lineGap（gpui-pre-windows）。改了什么、怎么升级见 vendor/README.md
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# 打过补丁的 markdown：GFM 自动链接遇全角标点收尾（vendor/markdown）
markdown = { path = "vendor/markdown" }
