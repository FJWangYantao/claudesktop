[workspace]
resolver = "3"
members = ["apps/desktop", "crates/core", "crates/builtin"]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
gpui-kit = "0.7.3"
agent-client-protocol = "3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
smol = "2"
