[package]
name = "claudesktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Swappable agent kernel abstraction (ACP-first)"

[dependencies]
agent-client-protocol = { workspace = true, features = ["process"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
smol = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
