[package]
name = "claudesktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Swappable agent kernel abstraction (ACP-first)"

[dependencies]
agent-client-protocol = { workspace = true, features = ["process"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = "2"
sha2 = "0.10"
# 公式排版（见「设计说明-聊天与Code分离.md」第六章）：RaTeX 把 LaTeX 排成 DisplayList，
# 再导出成自包含的 SVG（字形转路径，不依赖系统字体、不嵌 JS 引擎）
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-types = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["standalone", "embed-fonts"] }
futures = { workspace = true }
smol = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
